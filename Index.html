<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Francisca 2026</title>
    <style>
        /* Fonte arredondada e divertida estilo a da imagem */
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #784b00; /* O fundo marrom idêntico à sua logo */
            color: #ffffff;
            font-family: 'Fredoka', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
        }

        /* Identidade Francisca 2026 */
        .logo-box {
            margin-bottom: 35px;
        }

        .logo-box h1 {
            font-size: 3.8rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1;
        }

        .logo-box .year {
            font-size: 3.8rem;
            font-weight: 400;
            display: block;
            margin-top: 5px;
        }

        /* Caixa com as mensagens de aviso */
        .box-aviso {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.15);
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        h2.atencao {
            color: #ffbc42; /* Destaque em tom ouro/amarelo para o "Atenção!" */
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        p.mensagem {
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 20px;
            opacity: 0.95;
        }

        p.agradecimento {
            font-size: 1.2rem;
            font-weight: 600;
            margin-top: 25px;
        }

        /* Rodapé com direitos autorais solicitados */
        footer {
            margin-top: 60px;
            font-size: 0.95rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="logo-box">
            <h1>Francisca</h1>
            <span class="year">2026</span>
        </div>

        <div class="box-aviso">
            <h2 class="atencao">Atenção!</h2>
            
            <p class="mensagem">
                O site da Francisca 2026 não está funcionando no momento, pois o evento ainda não começou.
            </p>
            
            <p class="mensagem">
                Como a Francisca 2026 só começará no final do ano, volte aqui em dezembro!
            </p>
            
            <p class="agradecimento">Obrigado pela atenção.</p>
        </div>

        <footer>
            <p>©Francisca 2026 Copyright</p>
        </footer>

    </div>

</body>
</html>
